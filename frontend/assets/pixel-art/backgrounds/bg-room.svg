  <g fill="#F4ECD8">
    <rect x="0" y="180" width="16" height="16"/><rect x="32" y="180" width="16" height="16"/>
    <rect x="64" y="180" width="16" height="16"/><rect x="96" y="180" width="16" height="16"/>
    <rect x="128" y="180" width="16" height="16"/><rect x="160" y="180" width="16" height="16"/>
    <rect x="192" y="180" width="16" height="16"/><rect x="224" y="180" width="16" height="16"/>
    <rect x="256" y="180" width="16" height="16"/><rect x="288" y="180" width="16" height="16"/>
    <rect x="320" y="180" width="16" height="16"/><rect x="352" y="180" width="16" height="16"/>
    <rect x="16" y="196" width="16" height="16"/><rect x="48" y="196" width="16" height="16"/>
    <rect x="80" y="196" width="16" height="16"/><rect x="112" y="196" width="16" height="16"/>
    <rect x="144" y="196" width="16" height="16"/><rect x="176" y="196" width="16" height="16"/>
    <rect x="208" y="196" width="16" height="16"/><rect x="240" y="196" width="16" height="16"/>
    <rect x="272" y="196" width="16" height="16"/><rect x="304" y="196" width="16" height="16"/>
    <rect x="336" y="196" width="16" height="16"/><rect x="368" y="196" width="16" height="16"/>
    <rect x="0" y="212" width="16" height="16"/><rect x="32" y="212" width="16" height="16"/>
    <rect x="64" y="212" width="16" height="16"/><rect x="96" y="212" width="16" height="16"/>
    <rect x="128" y="212" width="16" height="16"/><rect x="160" y="212" width="16" height="16"/>
    <rect x="192" y="212" width="16" height="16"/><rect x="224" y="212" width="16" height="16"/>
    <rect x="256" y="212" width="16" height="16"/><rect x="288" y="212" width="16" height="16"/>
    <rect x="320" y="212" width="16" height="16"/><rect x="352" y="212" width="16" height="16"/>
  </g>
  <!-- food bowl -->
  <rect x="280" y="250" width="40" height="8" fill="#8A5A2B"/>
  <rect x="284" y="244" width="32" height="8" fill="#B8A99A"/>
  <rect x="288" y="240" width="24" height="6" fill="#F6C453"/>
