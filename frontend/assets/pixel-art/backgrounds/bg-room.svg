<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 0 800 740" shape-rendering="crispEdges">
  <!-- ぶたの部屋 背景 -->
  <!-- sky/wall -->
  <rect x="-200" width="800" height="180" fill="#1A1228"/>
  <!-- stars -->
  <rect x="40" y="30" width="4" height="4" fill="#FFF8E6"/>
  <rect x="120" y="60" width="4" height="4" fill="#FFF8E6"/>
  <rect x="200" y="20" width="4" height="4" fill="#F6C453"/>
  <rect x="280" y="50" width="4" height="4" fill="#FFF8E6"/>
  <rect x="350" y="30" width="4" height="4" fill="#FFF8E6"/>
  <rect x="80" y="90" width="4" height="4" fill="#F6C453"/>
  <rect x="310" y="100" width="4" height="4" fill="#FFF8E6"/>
