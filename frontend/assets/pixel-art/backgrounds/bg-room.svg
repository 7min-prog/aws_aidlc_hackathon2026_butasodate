  <rect x="300" y="20" width="24" height="24" fill="#F6C453"/>
  <rect x="308" y="20" width="16" height="4" fill="#1A1228"/>
  <rect x="312" y="24" width="12" height="8" fill="#1A1228"/>
  <!-- floor (checkerboard) -->
