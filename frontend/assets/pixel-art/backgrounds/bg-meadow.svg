<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 740" shape-rendering="crispEdges">
  <!-- 昼の草原背景 390x740 -->
  <!-- 空 (上部55%) -->
  <rect width="390" height="400" fill="#5A8ED1"/>
  <!-- 空のグラデーション（明るい帯） -->
  <rect width="390" height="80" fill="#7AAEE0"/>
  <!-- 雲 -->
  <g fill="#FFF8E6">
    <!-- 雲1 -->
    <rect x="40" y="100" width="48" height="12"/>
    <rect x="48" y="92" width="32" height="8"/>
    <rect x="52" y="88" width="20" height="6"/>
    <!-- 雲2 -->
    <rect x="240" y="140" width="60" height="12"/>
    <rect x="252" y="132" width="36" height="8"/>
    <rect x="260" y="126" width="20" height="6"/>
    <!-- 雲3 (小) -->
    <rect x="150" y="60" width="32" height="10"/>
    <rect x="156" y="54" width="20" height="6"/>
  </g>
  <!-- 太陽 -->
  <rect x="310" y="40" width="32" height="32" fill="#F6C453"/>
  <rect x="306" y="52" width="4" height="8" fill="#F6C453"/>
  <rect x="346" y="52" width="4" height="8" fill="#F6C453"/>
  <rect x="322" y="36" width="8" height="4" fill="#F6C453"/>
  <rect x="322" y="76" width="8" height="4" fill="#F6C453"/>
  <!-- 遠景の丘 -->
  <rect x="0" y="360" width="390" height="40" fill="#2F6B3C"/>
  <rect x="40" y="340" width="120" height="20" fill="#2F6B3C"/>
  <rect x="60" y="330" width="80" height="12" fill="#2F6B3C"/>
  <rect x="220" y="345" width="140" height="16" fill="#2F6B3C"/>
  <rect x="250" y="336" width="80" height="10" fill="#2F6B3C"/>
  <!-- 草原 (下部) -->
  <rect y="400" width="390" height="340" fill="#6CB979"/>
  <!-- 草のテクスチャ（濃い緑のドット） -->
  <g fill="#2F6B3C" opacity="0.4">
    <rect x="20" y="420" width="4" height="8"/>
    <rect x="60" y="440" width="4" height="8"/>
    <rect x="110" y="415" width="4" height="8"/>
    <rect x="150" y="450" width="4" height="8"/>
    <rect x="200" y="425" width="4" height="8"/>
    <rect x="250" y="445" width="4" height="8"/>
    <rect x="300" y="418" width="4" height="8"/>
    <rect x="350" y="438" width="4" height="8"/>
    <rect x="40" y="480" width="4" height="8"/>
    <rect x="90" y="500" width="4" height="8"/>
    <rect x="140" y="490" width="4" height="8"/>
    <rect x="190" y="510" width="4" height="8"/>
    <rect x="240" y="485" width="4" height="8"/>
    <rect x="290" y="505" width="4" height="8"/>
    <rect x="340" y="495" width="4" height="8"/>
    <rect x="70" y="560" width="4" height="8"/>
    <rect x="130" y="570" width="4" height="8"/>
    <rect x="220" y="555" width="4" height="8"/>
    <rect x="310" y="565" width="4" height="8"/>
    <rect x="370" y="550" width="4" height="8"/>
  </g>
  <!-- 花（ピンク） -->
  <g fill="#FF9BB3">
    <rect x="80" y="460" width="6" height="6"/>
    <rect x="170" y="520" width="6" height="6"/>
    <rect x="280" y="470" width="6" height="6"/>
    <rect x="350" y="540" width="6" height="6"/>
    <rect x="50" y="580" width="6" height="6"/>
    <rect x="230" y="600" width="6" height="6"/>
  </g>
  <!-- 花（黄色） -->
  <g fill="#F6C453">
    <rect x="120" y="480" width="6" height="6"/>
    <rect x="260" y="530" width="6" height="6"/>
    <rect x="30" y="540" width="6" height="6"/>
    <rect x="330" y="590" width="6" height="6"/>
  </g>
  <!-- 地面の境界（草原と空の間） -->
  <rect y="398" width="390" height="4" fill="#2F6B3C"/>
</svg>
