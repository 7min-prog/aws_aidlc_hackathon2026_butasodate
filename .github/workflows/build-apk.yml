name: Frontend Test & Build APK

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run tests
        run: flutter test --coverage --timeout 120s test/main_test.dart test/shared/ test/features/ test/screens/ test/golden/ test/unit/ test/pixel_app_bar_test.dart test/router_routes_test.dart test/login_legal_links_test.dart test/router_test.dart

      - name: Check coverage >= 90%
        run: |
          LH=$(grep -oP '^LH:\K\d+' coverage/lcov.info | paste -sd+ | bc)
          LF=$(grep -oP '^LF:\K\d+' coverage/lcov.info | paste -sd+ | bc)
          PCT=$(echo "scale=1; $LH * 100 / $LF" | bc)
          echo "Coverage: $LH / $LF = $PCT%"
          if [ $(echo "$PCT < 90" | bc) -eq 1 ]; then
            echo "::error::Coverage $PCT% is below 90% threshold"
            exit 1
          fi

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [dev, prod]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Build APK (${{ matrix.flavor }})
        run: flutter build apk --release -t lib/main_${{ matrix.flavor }}.dart

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
