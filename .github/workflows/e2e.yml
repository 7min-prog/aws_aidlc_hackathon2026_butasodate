name: E2E Tests

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Build Flutter web (prod)
        working-directory: frontend
        run: flutter build web -t lib/main_prod.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm ci && npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend/e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --reporter=list,html,json 2>&1 | tee test-output.txt

      - name: Generate test summary
        if: always()
        working-directory: frontend/e2e
        run: |
          PASS=$(grep -c "ok " test-output.txt 2>/dev/null || echo 0)
          FAIL=$(grep -c "  x " test-output.txt 2>/dev/null || echo 0)
          TOTAL=$((PASS + FAIL))
          echo "## 🌐 E2E Tests (Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ All E2E tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ $FAIL test(s) failed — see report artifact for details" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: frontend/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: frontend/e2e/test-results/
          retention-days: 7
