<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 740" shape-rendering="crispEdges">
  <!-- バトル画面背景 390x740 -->
  <!-- ダーク空間 -->
  <rect width="390" height="740" fill="#0A0612"/>
  <!-- 上部グラデーション -->
  <rect width="390" height="200" fill="#1A1228"/>
  <rect y="200" width="390" height="60" fill="#1A1228" opacity="0.6"/>
  <!-- アリーナ床 -->
  <rect x="0" y="440" width="390" height="300" fill="#3D2B4D"/>
  <rect x="20" y="460" width="350" height="260" fill="#0A0612"/>
  <!-- 床のグリッドライン -->
  <g stroke="#3D2B4D" stroke-width="2" fill="none">
    <line x1="20" y1="520" x2="370" y2="520"/>
    <line x1="20" y1="580" x2="370" y2="580"/>
    <line x1="20" y1="640" x2="370" y2="640"/>
    <line x1="20" y1="700" x2="370" y2="700"/>
    <line x1="100" y1="460" x2="100" y2="720"/>
    <line x1="195" y1="460" x2="195" y2="720"/>
    <line x1="290" y1="460" x2="290" y2="720"/>
  </g>
  <!-- 床の上端ライン（ネオン） -->
  <rect x="20" y="458" width="350" height="4" fill="#5A8ED1"/>
  <!-- エネルギーパーティクル -->
  <g fill="#F6C453">
    <rect x="50" y="80" width="4" height="4"/>
    <rect x="180" y="50" width="4" height="4"/>
    <rect x="300" y="100" width="4" height="4"/>
    <rect x="100" y="160" width="4" height="4"/>
    <rect x="340" y="180" width="4" height="4"/>
    <rect x="60" y="300" width="4" height="4"/>
    <rect x="250" y="350" width="4" height="4"/>
  </g>
  <g fill="#E8485A">
    <rect x="130" y="70" width="4" height="4"/>
    <rect x="260" y="140" width="4" height="4"/>
    <rect x="80" y="250" width="4" height="4"/>
    <rect x="320" y="320" width="4" height="4"/>
  </g>
  <g fill="#5A8ED1">
    <rect x="220" y="90" width="4" height="4"/>
    <rect x="350" y="60" width="4" height="4"/>
    <rect x="40" y="340" width="4" height="4"/>
    <rect x="290" y="280" width="4" height="4"/>
  </g>
  <g fill="#FF9BB3">
    <rect x="160" y="130" width="4" height="4"/>
    <rect x="310" y="240" width="4" height="4"/>
    <rect x="70" y="380" width="4" height="4"/>
  </g>
  <!-- VS スパーク（中央） -->
  <rect x="186" y="220" width="18" height="4" fill="#F6C453"/>
  <rect x="192" y="214" width="6" height="16" fill="#F6C453"/>
</svg>
