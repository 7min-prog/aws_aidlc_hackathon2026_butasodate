  <rect x="40" y="260" width="310" height="2" fill="#6B4420"/>
  <rect x="40" y="300" width="310" height="2" fill="#6B4420"/>
  <rect x="40" y="340" width="310" height="2" fill="#6B4420"/>
  <rect x="40" y="380" width="310" height="2" fill="#6B4420"/>
  <rect x="40" y="420" width="310" height="2" fill="#6B4420"/>
  <rect x="40" y="460" width="310" height="2" fill="#6B4420"/>
