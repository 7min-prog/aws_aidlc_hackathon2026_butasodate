  <rect x="74" y="224" width="4" height="32" fill="#3D2B4D"/>

  <!-- Window right -->
  <rect x="294" y="220" width="40" height="40" fill="#3D2B4D"/>
  <rect x="298" y="224" width="32" height="32" fill="#1A1228"/>
  <rect x="298" y="238" width="32" height="4" fill="#3D2B4D"/>
  <rect x="312" y="224" width="4" height="32" fill="#3D2B4D"/>

