  <rect x="140" y="560" width="8" height="24" fill="#8A5A2B"/>
  <rect x="240" y="560" width="8" height="24" fill="#8A5A2B"/>
  <rect x="300" y="560" width="8" height="24" fill="#8A5A2B"/>
  <rect x="360" y="560" width="8" height="24" fill="#8A5A2B"/>
