  <rect x="80" y="620" width="8" height="4" fill="#F6C453" opacity="0.5"/>
  <rect x="160" y="610" width="10" height="4" fill="#F6C453" opacity="0.5"/>
  <rect x="250" y="630" width="8" height="4" fill="#F6C453" opacity="0.5"/>
  <rect x="320" y="600" width="10" height="4" fill="#F6C453" opacity="0.5"/>
