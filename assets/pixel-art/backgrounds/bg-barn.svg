  <!-- Pig silhouette decoration on roof -->
  <rect x="178" y="90" width="34" height="24" fill="#FF9BB3"/>
  <rect x="182" y="84" width="8" height="8" fill="#FF9BB3"/>
  <rect x="200" y="84" width="8" height="8" fill="#FF9BB3"/>
