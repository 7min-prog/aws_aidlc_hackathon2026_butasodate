<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- bowl -->
  <rect x="4" y="16" width="24" height="4" fill="#FFF8E6"/>
  <rect x="6" y="20" width="20" height="6" fill="#E8485A"/>
  <rect x="8" y="26" width="16" height="2" fill="#E8485A"/>
  <rect x="10" y="28" width="12" height="2" fill="#C46A85"/>
  <!-- noodles hanging over bowl -->
  <rect x="8" y="14" width="2" height="4" fill="#F6C453"/>
  <rect x="14" y="12" width="2" height="6" fill="#F6C453"/>
  <rect x="20" y="14" width="2" height="4" fill="#F6C453"/>
  <!-- steam - big and visible -->
  <rect x="8" y="6" width="4" height="4" fill="#FFF8E6" opacity="0.8"/>
  <rect x="14" y="4" width="4" height="4" fill="#FFF8E6" opacity="0.8"/>
  <rect x="20" y="6" width="4" height="4" fill="#FFF8E6" opacity="0.8"/>
</svg>
