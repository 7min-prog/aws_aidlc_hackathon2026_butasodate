<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- ペン（きろくタブ） -->
  <!-- pen body -->
  <rect x="20" y="4" width="4" height="4" fill="#5A8ED1"/>
  <rect x="18" y="8" width="4" height="4" fill="#5A8ED1"/>
  <rect x="16" y="12" width="4" height="4" fill="#5A8ED1"/>
  <rect x="14" y="16" width="4" height="4" fill="#5A8ED1"/>
  <rect x="12" y="20" width="4" height="4" fill="#5A8ED1"/>
  <!-- pen tip -->
  <rect x="10" y="24" width="4" height="4" fill="#F6C453"/>
  <rect x="8" y="28" width="4" height="2" fill="#3D2B4D"/>
  <!-- pen top -->
  <rect x="22" y="2" width="4" height="4" fill="#3D2B4D"/>
  <rect x="24" y="4" width="4" height="2" fill="#3D2B4D"/>
  <!-- highlight -->
  <rect x="20" y="6" width="2" height="2" fill="#FFF8E6"/>
  <rect x="18" y="10" width="2" height="2" fill="#FFF8E6"/>
</svg>
